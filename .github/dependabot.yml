# Dependabot version updates. Pull requests target devel, like every other PR.
# Commit messages use a plain Conventional Commits prefix without a scope so
# they pass the "Commit messages" CI job (.commitlintrc.json).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: devel
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      github-actions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: devel
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /backend
    target-branch: devel
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]
